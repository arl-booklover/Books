<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookshelf Logger</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--ac:#7a4b2a;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a18;--fg:#eee;--card:#2a2724;--ac:#d9a066;--bd:#443f3a}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:12px;max-width:900px;margin:auto}
h1{font-size:1.3rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
input,button,select{font-size:1rem;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);box-sizing:border-box}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row>input{flex:1;min-width:120px}
video{width:100%;border-radius:8px;margin-top:8px;display:none;max-height:260px;object-fit:cover}
#msg{margin-top:8px;font-size:.9rem;min-height:1.2em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
td,th{border-bottom:1px solid var(--bd);padding:2px;text-align:left}
td input{width:100%;min-width:90px;padding:6px;font-size:.85rem}
th{position:sticky;top:0;background:var(--bg)}
</style></head><body>
<h1>📚 Bookshelf Logger</h1>

<div class="card">
  <label>Current shelf (applied to every book you add)</label>
  <div class="row"><input id="shelf" list="shelves" placeholder="e.g. Living room – Shelf 2"><datalist id="shelves"></datalist></div>
  <div class="row">
    <button id="photoBtn">📷 Photo of barcode</button>
    <button id="titleBtn">📖 Photo of title page</button>
    <input type="file" id="titlePhoto" accept="image/*" capture="environment" hidden>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    <input id="isbn" inputmode="numeric" placeholder="or type ISBN">
    <button id="addBtn">Add</button>
  </div>
  <div class="row"><input id="q" placeholder="or search by title / author"><button id="searchBtn">Search</button></div>
  <div id="results"></div>
  <div id="msg"></div>
</div>

<div class="card">
  <div class="row" style="margin:0 0 8px">
    <button id="csvBtn">⬇ Export CSV</button>
    <button class="sec" id="impBtn">⬆ Import CSV</button>
    <button class="sec" id="manBtn">+ Manual row</button>
    <input type="file" id="file" accept=".csv" hidden>
  </div>
  <div id="count"></div>
  <div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</div>

<script>
const COLS=["shelf","title","author","publisher","year","pages","isbn","notes"];
let books=[];
try{books=JSON.parse(localStorage.getItem("books")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("books",JSON.stringify(books))}catch(e){}};
const say=(t,err)=>{$("msg").textContent=t;$("msg").style.color=err?"#c0392b":"inherit"};
try{$("shelf").value=localStorage.getItem("shelf")||""}catch(e){}
$("shelf").oninput=()=>{try{localStorage.setItem("shelf",$("shelf").value)}catch(e){}};

function render(){
  $("head").innerHTML=COLS.map(c=>`<th>${c}</th>`).join("")+"<th></th>";
  $("body").innerHTML="";
  books.forEach((b,i)=>{
    const tr=document.createElement("tr");
    COLS.forEach(c=>{
      const td=document.createElement("td"),inp=document.createElement("input");
      inp.value=b[c]||"";
      inp.onchange=()=>{b[c]=inp.value;save();shelfList()};
      td.appendChild(inp);tr.appendChild(td);
    });
    const d=document.createElement("td"),x=document.createElement("button");
    x.textContent="✕";x.className="sec";x.style.padding="4px 8px";
    x.onclick=()=>{if(confirm("Delete this row?")){books.splice(i,1);save();render()}};
    d.appendChild(x);tr.appendChild(d);$("body").appendChild(tr);
  });
  $("count").textContent=books.length+" book"+(books.length==1?"":"s");
  shelfList();
}
function shelfList(){
  $("shelves").innerHTML=[...new Set(books.map(b=>b.shelf).filter(Boolean))].map(s=>`<option value="${s.replace(/"/g,"&quot;")}">`).join("");
}

async function lookup(isbn){
  try{
    const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const j=await r.json(),d=j["ISBN:"+isbn];
    if(d)return{title:d.title+(d.subtitle?": "+d.subtitle:""),author:(d.authors||[]).map(a=>a.name).join(", "),
      publisher:(d.publishers||[]).map(p=>p.name).join(", "),year:(d.publish_date||"").match(/\d{4}/)?.[0]||"",pages:d.number_of_pages||""};
  }catch(e){}
  try{
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const v=(await r.json()).items?.[0]?.volumeInfo;
    if(v)return{title:v.title+(v.subtitle?": "+v.subtitle:""),author:(v.authors||[]).join(", "),
      publisher:v.publisher||"",year:(v.publishedDate||"").slice(0,4),pages:v.pageCount||""};
  }catch(e){}
  return null;
}

async function addIsbn(raw){
  const isbn=(raw||"").replace(/[^0-9Xx]/g,"").toUpperCase();
  if(isbn.length!==10&&isbn.length!==13){say("That doesn't look like a valid ISBN.",true);return false}
  if(books.some(b=>b.isbn===isbn)&&!confirm("Already in your list. Add again?"))return false;
  say("Looking up "+isbn+"…");
  const info=await lookup(isbn);
  const shelf=$("shelf").value.trim();
  if(info){books.unshift({shelf,isbn,notes:"",...info});say("✓ Added: "+info.title)}
  else{books.unshift({shelf,isbn,title:"",author:"",publisher:"",year:"",pages:"",notes:"not found – fill in"});say("Not found online. Added a blank row to fill in.",true)}
  save();render();return true;
}
$("addBtn").onclick=async()=>{if(await addIsbn($("isbn").value))$("isbn").value=""};
$("isbn").onkeydown=e=>{if(e.key==="Enter")$("addBtn").click()};
$("manBtn").onclick=()=>{books.unshift({shelf:$("shelf").value.trim()});save();render()};

// Photo reading
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
let nativeDet=null,zx=null;
try{if("BarcodeDetector" in window)nativeDet=new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]})}catch(e){try{nativeDet=new BarcodeDetector()}catch(e2){}}
const loadJS=(src,test)=>window[test]?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const loadZX=()=>loadJS("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js","ZXing");
const loadTess=()=>loadJS("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js","Tesseract");
function zxDecode(canvas){
  if(!window.ZXing)return null;
  try{
    if(!zx){const h=new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]);
      h.set(ZXing.DecodeHintType.TRY_HARDER,true);
      zx=new ZXing.MultiFormatReader();zx.setHints(h)}
    const src=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText();
  }catch(e){return null}
}
async function decodeCanvas(c){
  if(nativeDet){try{const r=await nativeDet.detect(c);if(r[0])return r[0].rawValue}catch(e){}}
  return zxDecode(c);
}
async function drawFile(f,mw){
  const bmp=await createImageBitmap(f),sc=Math.min(1,mw/bmp.width);
  cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cx.drawImage(bmp,0,0,cv.width,cv.height);
}

// Barcode photo
$("photoBtn").onclick=()=>$("photo").click();
$("photo").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  say("Reading barcode…");
  try{await loadZX()}catch(_){}
  for(const mw of [1600,1000,2400]){
    try{await drawFile(f,mw)}catch(_){say("Couldn't open that photo.",true);return}
    const code=await decodeCanvas(cv);
    if(code){
      if(!/^(978|979)\d{10}$/.test(code)&&!/^\d{9}[\dX]$/i.test(code)){say("Read "+code+", but it isn't a book ISBN. Try the barcode starting 978/979.",true);return}
      await addIsbn(code);return;
    }
  }
  say("Couldn't read that barcode. Get closer, keep it flat and sharp, or use the title-page photo.",true);
};

// Title page photo (OCR) + search
$("titleBtn").onclick=()=>$("titlePhoto").click();
$("titlePhoto").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  say("Reading title page… the first time can take 20-30 seconds.");
  try{
    await loadTess();await drawFile(f,1600);
    const {data}=await Tesseract.recognize(cv,"eng");
    const lines=data.text.split("\n").map(l=>l.replace(/[^\p{L}\p{N}'&:,.\- ]/gu,"").replace(/\s+/g," ").trim()).filter(l=>l.length>2);
    if(!lines.length){say("Couldn't find any text. Try a sharper, well-lit photo, or type the title below.",true);return}
    $("q").value=lines.slice(0,3).join(" ");
    say("Check the text below, fix any mistakes, then tap Search.");
    search();
  }catch(err){say("Couldn't read the title page (needs internet). Type the title below instead.",true)}
};
$("searchBtn").onclick=search;
$("q").onkeydown=e=>{if(e.key==="Enter")search()};
async function search(){
  const q=$("q").value.trim(),box=$("results");
  if(!q){return}
  box.textContent="Searching…";
  try{
    const r=await fetch("https://openlibrary.org/search.json?limit=6&fields=title,subtitle,author_name,first_publish_year,publisher,number_of_pages_median,isbn&q="+encodeURIComponent(q));
    const docs=(await r.json()).docs||[];
    box.textContent="";
    docs.forEach(d=>{
      const b=document.createElement("button");b.className="sec";b.style.cssText="display:block;width:100%;text-align:left;margin-top:6px";
      b.textContent=d.title+(d.author_name?" — "+d.author_name[0]:"")+(d.first_publish_year?" ("+d.first_publish_year+")":"");
      b.onclick=()=>{
        books.unshift({shelf:$("shelf").value.trim(),isbn:(d.isbn||[])[0]||"",title:d.title+(d.subtitle?": "+d.subtitle:""),
          author:(d.author_name||[]).join(", "),publisher:(d.publisher||[])[0]||"",year:d.first_publish_year||"",
          pages:d.number_of_pages_median||"",notes:"added by title search"});
        save();render();box.textContent="";$("q").value="";say("✓ Added: "+d.title);
      };
      box.appendChild(b);
    });
    const m=document.createElement("button");m.className="sec";m.style.cssText="display:block;width:100%;text-align:left;margin-top:6px";
    m.textContent=docs.length?"None of these – add what I typed as a new row":"No matches – add what I typed as a new row";
    m.onclick=()=>{books.unshift({shelf:$("shelf").value.trim(),title:q,notes:"entered manually"});save();render();box.textContent="";$("q").value="";say("Added a row. Fill in the details in the table.")};
    box.appendChild(m);
  }catch(e){box.textContent="Search failed (needs internet).";}
}

// CSV
const esc=s=>{s=String(s??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
$("csvBtn").onclick=()=>{
  const csv=[COLS.join(","),...books.map(b=>COLS.map(c=>esc(b[c])).join(","))].join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
  a.download="my-books.csv";a.click();
};
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==",")r.push(f),f="";
    else if(c=="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows;
}
$("impBtn").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const rows=parseCSV((await f.text()).replace(/^\ufeff/,""));
  const h=rows.shift().map(x=>x.trim().toLowerCase());
  rows.filter(r=>r.some(x=>x)).forEach(r=>{const b={};COLS.forEach(c=>{const i=h.indexOf(c);b[c]=i>=0?r[i]:""});books.push(b)});
  save();render();say("Imported.");e.target.value="";
};
render();
</script></body></html>
